name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  jvm-and-android:
    name: JVM + Android host tests, iOS klibs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Stage the pinned Android bindings
        run: scripts/fetch-bindings.sh android
      - name: Check generated models against the pin
        run: scripts/generate-models.sh --check
      - name: Test and compile
        run: ./gradlew check compileKotlinIosArm64 compileKotlinIosSimulatorArm64 --continue

  ios:
    name: iOS simulator tests (real runtime)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Stage the pinned bindings
        run: scripts/fetch-bindings.sh all
      - name: Simulator tests (pure modules and the embedded runtime)
        run: ./gradlew iosSimulatorArm64Test --continue
      - name: Assemble the WavelengthKit XCFramework
        run: ./gradlew :wavelength-kit:assembleWavelengthKitXCFramework

  android-device:
    name: Android emulator tests (real runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space for the 191 MB bindings
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Stage the pinned Android bindings
        run: scripts/fetch-bindings.sh android
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: ./gradlew :wavelength-embedded:connectedAndroidDeviceTest
